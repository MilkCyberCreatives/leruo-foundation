name: Refresh audit lockfile

on:
  push:
    branches: [release/security-search-20260909]

permissions:
  contents: write

jobs:
  refresh-audit-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: release/security-search-20260909

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply compatible audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Verify dependency audit
        run: npm audit --audit-level=high

      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh vulnerable dev-tooling transitives"
          git push origin HEAD:release/security-search-20260909
